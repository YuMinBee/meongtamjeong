name: Full runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Cache OpenAI CLIP weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/clip
          key: openai-clip-vit-b32-v1

      - name: Install the clean validated environment
        run: |
          python -m pip install --upgrade "pip==25.2" "setuptools==80.10.2" "wheel==0.47.0"
          python -m pip install -r requirements.lock.txt
          python -m pip check

      - name: Verify the exact dependency snapshot
        run: python scripts/check_dependency_snapshot.py

      - name: Verify the fixed active-only snapshot
        run: >-
          python scripts/check_contest_readiness.py
          --metas data/dog_metas.json
          --index data/dog_faiss.index
          --reference-date 2026-07-26
          --max-age-days 0
          --strict

      - name: Exercise real CPU CLIP, FAISS, API, and inquiry flow
        run: python scripts/smoke_full_runtime.py
