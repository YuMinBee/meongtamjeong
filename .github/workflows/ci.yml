name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app scripts tests

      - name: Pytest
        run: python -m pytest -q

      - name: Install lightweight artifact verifier
        run: python -m pip install "faiss-cpu>=1.8,<2"

      - name: Verify tracked snapshot at its fixed reference date
        run: >-
          python scripts/check_contest_readiness.py
          --metas data/dog_metas.json
          --index data/dog_faiss.index
          --reference-date 2026-07-26
          --max-age-days 0
          --strict

      - name: Verify deterministic evaluation artifacts
        run: |
          python scripts/evaluate_retrieval.py --check
          python scripts/evaluate_query_robustness.py --check
          python scripts/evaluate_exposure_representation.py --check
          python scripts/evaluate_profile_reranking.py --check
          python scripts/evaluate_safety_contract.py --check
          python scripts/evaluate_heldout_image_retrieval.py --check
          python scripts/portal_candidate_selection_study.py validate-template

      # The frozen v2/v3 one-shot reports are historical evidence tied to their
      # recorded code hashes. A final contest release must create a new holdout
      # after the implementation and live snapshot are frozen.

      - name: Secret-scan release candidates
        run: python scripts/package_release.py --check-only
